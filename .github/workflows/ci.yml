name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Ubuntu host
        uses: bootc-dev/actions/bootc-ubuntu-setup@40859f0934be02542d553a24e8384c693e43e4a8
        with:
          libvirt: false
      - name: Set up Rust
        uses: bootc-dev/actions/setup-rust@40859f0934be02542d553a24e8384c693e43e4a8
      - name: Run checks
        run: just check-all
      - name: Upload check logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: checks-logs
          path: target/integration-logs/
          if-no-files-found: warn
          retention-days: 7

  rootfs-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        case: [bootc44, silverblue44, kinoite44]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Ubuntu host
        uses: bootc-dev/actions/bootc-ubuntu-setup@40859f0934be02542d553a24e8384c693e43e4a8
        with:
          libvirt: false
      - name: Set up Rust
        uses: bootc-dev/actions/setup-rust@40859f0934be02542d553a24e8384c693e43e4a8
      - name: Run rootfs integration
        run: just integration '${{ matrix.case }}'
      - name: Upload integration logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.case }}-integration-logs
          path: target/integration-logs/
          if-no-files-found: warn
          retention-days: 7

  publish-builder-arch:
    name: Publish builder (${{ matrix.arch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, rootfs-integration]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      BUILDER_IMAGE: ghcr.io/cgwalters-bot/container-rootfs-builder
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.BUILDER_IMAGE }}
          labels: |
            org.opencontainers.image.title=container-rootfs-builder
            org.opencontainers.image.description=Experimental source-backed Fedora rootfs builder; bundled software retains its upstream licenses
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: type=image,name=${{ env.BUILDER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Smoke-test pushed builder digest
        env:
          BUILDER_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p target/integration-logs
          image="${BUILDER_IMAGE}@${BUILDER_DIGEST}"
          docker run --rm "${image}" 2>&1 | tee target/integration-logs/builder-default-inspect.log
          docker run --rm "${image}" \
            --from=quay.io/fedora/fedora:45 --plan /target-rootfs \
            2>&1 | tee target/integration-logs/builder-plan.log
      - name: Export digest
        env:
          BUILDER_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          digest_dir="${RUNNER_TEMP}/builder-digests"
          mkdir -p "${digest_dir}"
          touch "${digest_dir}/${BUILDER_DIGEST#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: builder-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/builder-digests/*
          if-no-files-found: error
          retention-days: 1
      - name: Upload builder smoke-test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: builder-${{ matrix.arch }}-logs
          path: target/integration-logs/
          if-no-files-found: warn
          retention-days: 7

  publish-builder-index:
    name: Publish builder multiarch index
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-builder-arch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      BUILDER_IMAGE: ghcr.io/cgwalters-bot/container-rootfs-builder
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ${{ runner.temp }}/builder-digests
          pattern: builder-digest-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Generate index metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.BUILDER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.sha }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest index
        working-directory: ${{ runner.temp }}/builder-digests
        run: |
          set -euo pipefail
          shopt -s nullglob
          digests=(*)
          test "${#digests[@]}" -eq 2
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          test "${#tags[@]}" -eq 4
          sources=()
          for digest in "${digests[@]}"; do
            [[ "${digest}" =~ ^[0-9a-f]{64}$ ]]
            sources+=("${BUILDER_IMAGE}@sha256:${digest}")
          done
          mkdir -p "${RUNNER_TEMP}/builder-logs"
          docker buildx imagetools create "${tags[@]}" "${sources[@]}" \
            2>&1 | tee "${RUNNER_TEMP}/builder-logs/create-index.log"
      - name: Validate published platforms
        run: |
          set -euo pipefail
          for tag in latest "sha-${GITHUB_SHA}"; do
            manifest="$(docker buildx imagetools inspect --raw "${BUILDER_IMAGE}:${tag}")"
            jq -e '
              [.manifests[].platform
               | select(.os == "linux")
               | (.os + "/" + .architecture)]
              | sort == ["linux/amd64", "linux/arm64"]
            ' <<< "${manifest}"
            docker buildx imagetools inspect "${BUILDER_IMAGE}:${tag}" \
              2>&1 | tee "${RUNNER_TEMP}/builder-logs/inspect-${tag}.log"
          done
      - name: Upload index publication logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: builder-index-logs
          path: ${{ runner.temp }}/builder-logs/
          if-no-files-found: warn
          retention-days: 7
