[package]
name = "container-rootfs-builder"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Draft planner and executor for Fedora-oriented container root filesystems"

[[bin]]
name = "container-rootfs-builder"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
cap-std = "3.4"
clap = { version = "4.5", features = ["derive"] }
nickel-lang-core = { version = "0.19", default-features = false }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
roxmltree = "0.20"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.15"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unused_imports = "deny"
dead_code = "deny"

[lints.clippy]
disallowed_methods = "deny"
dbg_macro = "deny"
todo = "deny"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
